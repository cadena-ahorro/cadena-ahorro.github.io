<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Tablero</title>
  <script>window.API_URL = "https://script.google.com/macros/s/AKfycbw5CH6Tbu7RbZ2pXpdJJShhqbzZXe0TMK2D8iSUTnLjI5v26IWVrPjV9qklffGbUGT35Q/exec";</script>
  <style>
  :root {
    --fondo: #f6f5f1; --tarjeta: #ffffff; --suave: #f0efea; --texto: #1f1e1b; --texto2: #5f5e5a; --texto3: #8a8983;
    --borde: rgba(0,0,0,.12); --acento: #185fa5; --acento-bg: #e6f1fb;
    --ok: #3b6d11; --ok-bg: #eaf3de; --warn: #854f0b; --warn-bg: #faeeda; --mal: #a32d2d; --mal-bg: #fcebeb;
    --lila: #534ab7; --lila-bg: #eeedfe; --naranja: #993c1d; --naranja-bg: #faece7; --gris-bg: #ecebe6;
    --radio: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #161614; --tarjeta: #22221f; --suave: #2c2c29; --texto: #f1efe8; --texto2: #b4b2a9; --texto3: #888780;
      --borde: rgba(255,255,255,.14); --acento: #85b7eb; --acento-bg: #0c447c;
      --ok: #c0dd97; --ok-bg: #27500a; --warn: #fac775; --warn-bg: #633806; --mal: #f7c1c1; --mal-bg: #791f1f;
      --lila: #cecbf6; --lila-bg: #3c3489; --naranja: #f5c4b3; --naranja-bg: #712b13; --gris-bg: #3a3a37;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 2px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 8px; }
  .sub { color: var(--texto2); font-size: 13px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
  .metrica { background: var(--suave); border-radius: var(--radio); padding: 10px 12px; }
  .metrica .et { font-size: 12px; color: var(--texto2); }
  .metrica .val { font-size: 20px; font-weight: 600; }
  .metrica .det { font-size: 12px; color: var(--texto3); }
  button, .boton { font: inherit; font-size: 14px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto);
    border-radius: var(--radio); padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  button:hover, .boton:hover { background: var(--suave); }
  button.primario { background: var(--acento); color: #fff; border-color: var(--acento); }
  @media (prefers-color-scheme: dark) { button.primario { color: #042c53; } }
  button:disabled { opacity: .6; cursor: default; }
  button.primario:hover:not(:disabled) { filter: brightness(1.1); }
  select, input[type=file], label[for], a[href], [onclick] { cursor: pointer; }
  button.chico, .boton.chico { font-size: 12px; padding: 4px 10px; }
  .ancho { width: 100%; }
  input, select, textarea { font: inherit; color: var(--texto); background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 8px 10px; }
  .fila-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .etiqueta { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .e-a_tiempo { background: var(--ok-bg); color: var(--ok); }
  .e-tarde { background: var(--lila-bg); color: var(--lila); }
  .e-por_revisar, .e-procesando { background: var(--warn-bg); color: var(--warn); }
  .e-parcial { background: var(--naranja-bg); color: var(--naranja); }
  .e-vencido, .e-rechazado { background: var(--mal-bg); color: var(--mal); }
  .e-receptor_sin_cuota, .e-receptor { background: var(--acento-bg); color: var(--acento); }
  .e-pendiente, .e-futura { background: var(--suave); color: var(--texto2); }
  .e-antes { background: var(--gris-bg); color: var(--texto3); }
  .e-verificado_ia, .e-verificado_admin { background: var(--ok-bg); color: var(--ok); }
  .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .p-a_tiempo { background: #639922; } .p-tarde { background: #7f77dd; } .p-por_revisar { background: #ef9f27; }
  .p-parcial { background: #d85a30; } .p-vencido { background: #e24b4a; } .p-receptor_sin_cuota { background: #378add; }
  .p-pendiente, .p-futura { border: 1.5px solid var(--texto3); } .p-antes { background: var(--gris-bg); }
  .aviso { border-radius: var(--radio); padding: 10px 12px; font-size: 14px; margin: 10px 0; }
  .aviso.warn { background: var(--warn-bg); color: var(--warn); }
  .aviso.mal { background: var(--mal-bg); color: var(--mal); }
  .aviso.ok { background: var(--ok-bg); color: var(--ok); }
  .aviso.info { background: var(--acento-bg); color: var(--acento); }
  .aviso.alerta { background: #fde68a; color: #5c3a00; border: 2px solid #d97706; font-size: 15px; padding: 12px 14px; }
  .aviso.alerta .alerta-titulo { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  @media (prefers-color-scheme: dark) { .aviso.alerta { background: #7c4a03; color: #fff4d6; border-color: #fbbf24; } }
  .cargando { color: var(--texto2); padding: 40px 0; text-align: center; }
  .oculto { display: none !important; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--texto2); font-weight: 500; border-top: none; }
  .num { text-align: right; white-space: nowrap; }
  img.recibo { max-width: 100%; max-height: 520px; border-radius: 8px; border: 1px solid var(--borde); display: block; }
</style>

  <style>
    .persona { border-top: 1px solid var(--borde); padding: 10px 0; }
    .persona:first-child { border-top: none; }
    .persona .cab { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .persona .cab.clicable { cursor: pointer; border-radius: var(--radio); margin: -4px -6px; padding: 4px 6px; }
    .persona .cab.clicable:hover { background: var(--suave); }
    .persona .nom { flex: 1; min-width: 150px; }
    .persona .monto { font-size: 13px; color: var(--texto2); white-space: nowrap; }
    .detalle { background: var(--suave); border-radius: var(--radio); padding: 12px; margin-top: 10px; }
    .pago { border-top: 1px solid var(--borde); padding-top: 10px; margin-top: 10px; }
    .pago:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .datos-ia { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 8px 0; }
    .datos-ia span:nth-child(odd) { color: var(--texto2); }
    .filtros button.activo { background: var(--acento-bg); color: var(--acento); border-color: transparent; }
    .barra { height: 8px; border-radius: 4px; background: var(--suave); overflow: hidden; }
    .barra > div { height: 100%; background: #639922; }
  </style>
</head>
<body>
<main>
  <div id="cargando" class="cargando">Cargando…</div>
  <div id="app" class="oculto">
    <div class="fila-flex" style="justify-content:space-between">
      <div>
        <p class="sub" id="cadena"></p>
        <h1 id="titulo"></h1>
        <p class="sub" id="plazo"></p>
        <p class="sub" id="actualizando"></p>
      </div>
      <div class="fila-flex">
        <button class="chico" id="ant" aria-label="Quincena anterior">‹</button>
        <select id="sel-quincena"></select>
        <button class="chico" id="sig" aria-label="Quincena siguiente">›</button>
      </div>
    </div>
    <div id="avisos"></div>

    <div class="metricas" id="metricas"></div>
    <div class="tarjeta" id="receptor"></div>

    <div class="tarjeta">
      <div class="fila-flex filtros" style="margin-bottom:6px">
        <button class="chico activo" data-filtro="todos">Todos</button>
        <button class="chico" data-filtro="faltan">Faltan</button>
        <button class="chico" data-filtro="revisar">Por revisar</button>
        <button class="chico" data-filtro="listos">Al día</button>
        <span style="flex:1"></span>
        <button class="chico" id="refrescar">Actualizar</button>
      </div>
      <div id="lista"></div>
    </div>

    <div class="tarjeta">
      <div class="fila-flex" style="justify-content:space-between">
        <h2 style="margin:0">Estadísticas de la cadena</h2>
        <button class="chico" id="ver-estad">Ver</button>
      </div>
      <div id="estadisticas"></div>
    </div>

    <div class="tarjeta">
      <div class="fila-flex" style="justify-content:space-between">
        <h2 style="margin:0">Links personales</h2>
        <button class="chico" id="ver-links">Ver</button>
      </div>
      <div id="links"></div>
    </div>
  </div>
</main>

<script>
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  function plata(n) {
    return '$' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function fechaCorta(s) {
    if (!s) return '';
    var p = String(s).slice(0, 10).split('-');
    return Number(p[2]) + ' ' + MESES[Number(p[1]) - 1];
  }

  /** Crea elementos sin usar innerHTML con datos (evita inyección de HTML). */
  function el(tag, attrs, hijos) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'texto') e.textContent = attrs[k];
      else if (k === 'clase') e.className = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    [].concat(hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      e.appendChild(typeof h === 'string' ? document.createTextNode(h) : h);
    });
    return e;
  }

  /** Última respuesta guardada en el celular, para mostrarla al instante mientras llega la nueva. */
  function guardado(clave) {
    try { var v = localStorage.getItem('cadena:' + clave); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function guardar(clave, valor) {
    try { localStorage.setItem('cadena:' + clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento: no pasa nada */ }
  }

  /** Parámetro de la dirección (?t=... o ?admin=...). */
  function parametro(nombre) {
    var m = location.search.match(new RegExp('[?&]' + nombre + '=([^&#]+)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  /**
   * Llama una función del motor. Publicada fuera de Google (window.API_URL) usa fetch,
   * que no envía la sesión de Google del celular; dentro de Google usa google.script.run.
   */
  function llamar(fn) {
    var args = [].slice.call(arguments, 1);
    if (window.API_URL) {
      return fetch(window.API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
        .catch(function () { throw new Error('No hay conexión. Revisa tu internet e intenta de nuevo'); })
        .then(function (r) {
          if (!r.ok) throw new Error('El sistema no respondió (' + r.status + '). Intenta de nuevo');
          return r.json();
        })
        .then(function (j) {
          if (!j.ok) throw new Error(j.error);
          return j.data;
        });
    }
    return new Promise(function (ok, mal) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { mal(e); });
      r[fn].apply(r, args);
    });
  }

  function mensajeError(e) {
    var m = (e && e.message) || String(e);
    return m.replace(/^Exception: /, '').replace(/^Error: /, '');
  }

  /** Reduce la foto a JPEG de máx. 1600 px (sube rápido y la IA la lee igual de bien). Los PDF pasan tal cual. */
  function prepararArchivo(archivo) {
    return new Promise(function (ok, mal) {
      if (archivo.type === 'application/pdf') {
        if (archivo.size > 10 * 1024 * 1024) return mal(new Error('El PDF pesa más de 10 MB.'));
        var lector = new FileReader();
        lector.onload = function () { ok({ datos: String(lector.result).split(',')[1], tipo: 'application/pdf', nombre: archivo.name }); };
        lector.onerror = function () { mal(new Error('No se pudo leer el PDF.')); };
        return lector.readAsDataURL(archivo);
      }
      var url = URL.createObjectURL(archivo);
      var img = new Image();
      img.onload = function () {
        var max = 1600;
        var escala = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * escala);
        c.height = Math.round(img.naturalHeight * escala);
        var cx = c.getContext('2d');
        cx.fillStyle = '#ffffff';
        cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        ok({ datos: dataUrl.split(',')[1], tipo: 'image/jpeg', nombre: 'recibo.jpg', vista: dataUrl });
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        mal(new Error('No se pudo abrir esa imagen. Prueba con una captura de pantalla del comprobante.'));
      };
      img.src = url;
    });
  }
</script>

<script>
  var CLAVE = document.body.getAttribute('data-k') || parametro('admin');
  var d = null;
  var filtro = 'todos';
  var abiertos = {};

  var TEXTO = {
    a_tiempo: 'Pagó a tiempo', tarde: 'Pagó tarde', por_revisar: 'Por revisar', parcial: 'Pago parcial',
    pendiente: 'Pendiente', futura: 'Aún no abre', vencido: 'Vencido', receptor_sin_cuota: 'Recibe · sin cuota',
    antes: 'Antes del sistema', verificado_ia: 'Verificado por IA', verificado_admin: 'Aprobado por ti',
    rechazado: 'Rechazado', procesando: 'Sin leer'
  };
  var ORDEN = ['por_revisar', 'vencido', 'parcial', 'pendiente', 'futura', 'receptor_sin_cuota', 'tarde', 'a_tiempo', 'antes'];
  var AL_DIA = { a_tiempo: 1, tarde: 1 };

  var ultimoJson = '';

  /** Muestra datos nuevos del tablero; solo vuelve a dibujar si algo cambió. */
  function aplicar(r, clave) {
    var json = JSON.stringify(r);
    guardar(clave || 't:' + r.quincena.fecha, r);
    guardar('t:' + r.quincena.fecha, r);
    document.title = 'Tablero · ' + r.cadena;
    mostrarApp();
    if (json === ultimoJson) return;
    ultimoJson = json;
    d = r;
    pintar();
  }

  /**
   * fresco = true después de aprobar, rechazar o registrar: no mostrar la copia vieja ni un instante.
   * silencioso = true en la actualización automática: sin "Actualizando…" ni mensajes de error.
   */
  function cargar(fecha, fresco, silencioso) {
    var clave = 't:' + (fecha || 'actual');
    var aviso = document.getElementById('actualizando');
    if (!fresco) {
      var viejo = guardado(clave);
      if (viejo) aplicar(viejo, clave);
    }
    if (!silencioso) aviso.textContent = 'Actualizando…';
    return llamar('apiTablero', CLAVE, fecha || null).then(function (r) {
      aplicar(r, clave);
      aviso.textContent = '';
    }).catch(function (e) {
      if (silencioso) return;
      if (d) aviso.textContent = 'No se pudo actualizar: ' + mensajeError(e);
      else document.getElementById('cargando').textContent = mensajeError(e);
    });
  }

  // Actualización automática: cada 30 s mientras la página está a la vista, y al volver a ella.
  // No se actualiza mientras hay un recibo o un formulario abierto (se perdería lo que se está escribiendo).
  function editando() {
    var foco = document.activeElement;
    if (foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return true;
    return Object.keys(abiertos).some(function (k) { return abiertos[k]; });
  }
  function actualizarSolo() {
    if (!d || document.visibilityState !== 'visible' || editando()) return;
    cargar(d.quincena.fecha, true, true);
  }
  setInterval(actualizarSolo, 30000);
  document.addEventListener('visibilitychange', actualizarSolo);

  function mostrarApp() {
    document.getElementById('cargando').classList.add('oculto');
    document.getElementById('app').classList.remove('oculto');
  }

  function pintar() {
    var q = d.quincena;
    document.getElementById('cadena').textContent = d.cadena + ' · hoy ' + fechaCorta(d.hoy);
    document.getElementById('titulo').textContent = 'Quincena #' + q.numero + ' · ' + fechaCorta(q.fecha);
    document.getElementById('plazo').textContent = 'Plazo de pago: ' + fechaCorta(q.plazoInicio) + ' al ' + fechaCorta(q.plazoFin) +
      (d.hoy < q.plazoInicio ? ' · aún no abre' : d.hoy > q.plazoFin ? ' · cerrado' : ' · abierto');

    var sel = document.getElementById('sel-quincena');
    sel.innerHTML = '';
    d.quincenas.forEach(function (x) {
      var o = el('option', { value: x.fecha, texto: '#' + x.numero + ' – ' + fechaCorta(x.fecha) });
      if (x.fecha === q.fecha) o.selected = true;
      sel.appendChild(o);
    });

    var av = document.getElementById('avisos');
    av.innerHTML = '';
    if (d.simulado) av.appendChild(el('div', { clase: 'aviso warn', texto: 'Modo pruebas: la fecha de hoy está simulada (HOY_SIMULADO en Configuracion).' }));
    if (d.resumen.antesDelSistema) av.appendChild(el('div', { clase: 'aviso info', texto: 'Esta quincena es anterior al arranque del sistema. Puedes registrar pagos a mano si quieres el histórico.' }));
    d.errores.forEach(function (e) {
      if (/^Falta la cuenta de/.test(e)) {
        // Aviso importante para la administradora: título en negrita y el detalle debajo
        var corte = e.indexOf('. ');
        av.appendChild(el('div', { clase: 'aviso alerta', role: 'alert' }, [
          el('div', { clase: 'alerta-titulo', texto: '⚠ ' + e.slice(0, corte + 1) }),
          el('div', { texto: e.slice(corte + 2) })
        ]));
      } else {
        av.appendChild(el('div', { clase: 'aviso mal', texto: e }));
      }
    });

    var r = d.resumen;
    var m = document.getElementById('metricas');
    m.innerHTML = '';
    [
      ['Recaudado', plata(r.recaudado), 'de ' + plata(r.esperado)],
      ['Al día', r.personasCubiertas + ' / ' + r.personas, 'personas'],
      ['Por revisar', String(r.porRevisar), r.porRevisar === 1 ? 'recibo' : 'recibos'],
      ['Vencidos', String(r.vencidos), 'personas sin pagar']
    ].forEach(function (x) {
      m.appendChild(el('div', { clase: 'metrica' }, [el('div', { clase: 'et', texto: x[0] }), el('div', { clase: 'val', texto: x[1] }), el('div', { clase: 'det', texto: x[2] })]));
    });

    var rc = document.getElementById('receptor');
    rc.innerHTML = '';
    if (d.receptor) {
      rc.appendChild(el('div', { clase: 'fila-flex' }, [
        el('span', { clase: 'etiqueta e-receptor', texto: 'Recibe' }),
        el('b', { texto: d.receptor.nombre }),
        el('span', { clase: 'sub', texto: [d.receptor.titular.toUpperCase() === d.receptor.nombre ? '' : d.receptor.titular,
          d.receptor.banco, d.receptor.cuenta].filter(Boolean).join(' · ') })
      ]));
    }
    pintarLista();
  }

  function pasaFiltro(f) {
    if (filtro === 'faltan') return !AL_DIA[f.estado] && f.estado !== 'por_revisar' && f.estado !== 'antes';
    if (filtro === 'revisar') return f.estado === 'por_revisar' || pagosDe(f).some(function (p) { return p.estado === 'procesando'; });
    if (filtro === 'listos') return !!AL_DIA[f.estado];
    return true;
  }

  function pagosDe(f) {
    return d.pagos.filter(function (p) { return p.participanteId === f.id; });
  }

  function pintarLista() {
    var lista = document.getElementById('lista');
    lista.innerHTML = '';
    var filas = d.filas.slice().sort(function (a, b) {
      return ORDEN.indexOf(a.estado) - ORDEN.indexOf(b.estado) || a.nombre.localeCompare(b.nombre);
    }).filter(pasaFiltro);
    if (!filas.length) lista.appendChild(el('p', { clase: 'sub', style: 'padding:12px 0', texto: 'Nadie en este filtro.' }));
    filas.forEach(function (f) { lista.appendChild(filaPersona(f)); });
  }

  function mensajeRecordatorio(f) {
    var q = d.quincena;
    var nombre = f.nombre.split(' ')[0];
    nombre = nombre.charAt(0) + nombre.slice(1).toLowerCase();
    var falta = Math.max(0, f.esperado - f.pagado);
    var destino = d.receptor ? ' a ' + d.receptor.titular + (d.receptor.cuenta ? ' (' + [d.receptor.banco, d.receptor.cuenta].filter(Boolean).join(' ') + ')' : '') : '';
    var cuando = d.hoy > q.plazoFin ? 'El plazo venció el ' + fechaCorta(q.plazoFin) + '.' :
      d.hoy < q.plazoInicio ? 'El plazo es del ' + fechaCorta(q.plazoInicio) + ' al ' + fechaCorta(q.plazoFin) + '.' :
      'El plazo es hasta el ' + fechaCorta(q.plazoFin) + '.';
    return 'Hola ' + nombre + ', por favor recuerda subir el soporte de pago de la cadena de la quincena del ' +
      fechaCorta(q.fecha) + ': ' + plata(falta) + destino + '. ' + cuando +
      '\n\nSúbelo por tu link (es solo tuyo, no lo compartas):\n' + f.link;
  }

  function filaPersona(f) {
    var pagos = pagosDe(f);
    var alternar = function () { abiertos[f.id] = !abiertos[f.id]; pintarLista(); };
    var cab = el('div', pagos.length ? { clase: 'cab clicable', title: 'Ver recibos', onclick: alternar } : { clase: 'cab' }, [
      el('span', { clase: 'punto p-' + f.estado }),
      el('div', { clase: 'nom' }, [
        el('div', { texto: f.nombre }),
        el('div', { clase: 'sub', texto: (f.puestos.length === 1 ? 'Puesto ' : 'Puestos ') + f.puestos.join(', ') + (f.maximo > f.esperado ? ' (compartido)' : '') })
      ]),
      el('span', { clase: 'monto', texto: plata(f.pagado) + ' de ' + plata(f.esperado) }),
      f.esReceptor ? el('span', { clase: 'etiqueta e-receptor', texto: 'Recibe' }) : null,
      el('span', { clase: 'etiqueta e-' + f.estado, texto: TEXTO[f.estado] })
    ]);
    var acciones = el('div', { clase: 'fila-flex', style: 'margin-top:8px;padding-left:20px' });
    if (pagos.length) {
      acciones.appendChild(el('button', { clase: 'chico', onclick: alternar },
        (abiertos[f.id] ? 'Ocultar' : 'Ver') + ' recibo' + (pagos.length > 1 ? 's (' + pagos.length + ')' : '')));
    }
    if (!AL_DIA[f.estado] && f.estado !== 'por_revisar' && f.estado !== 'antes' && f.celular) {
      acciones.appendChild(el('a', { clase: 'boton chico', target: '_blank', href: 'https://wa.me/' + f.celular + '?text=' + encodeURIComponent(mensajeRecordatorio(f)) }, 'Recordar por WhatsApp'));
    }
    acciones.appendChild(el('button', { clase: 'chico', onclick: function () { abiertos[f.id + ':manual'] = !abiertos[f.id + ':manual']; pintarLista(); } }, 'Registrar pago a mano'));

    var cont = el('div', { clase: 'persona' }, [cab, acciones]);
    if (abiertos[f.id] && pagos.length) {
      var det = el('div', { clase: 'detalle' });
      pagos.forEach(function (p) { det.appendChild(bloquePago(p)); });
      cont.appendChild(det);
    }
    if (abiertos[f.id + ':manual']) cont.appendChild(formManual(f));
    return cont;
  }

  /** Desactiva los botones de un recibo mientras se guarda (evita dobles clics). */
  function bloquear(caja, si) {
    [].forEach.call(caja.querySelectorAll('button, input'), function (b) { b.disabled = si; });
  }

  function bloquePago(p) {
    var caja = el('div', { clase: 'pago' });
    caja.appendChild(el('div', { clase: 'fila-flex', style: 'justify-content:space-between' }, [
      el('span', { clase: 'sub', texto: 'Subido ' + p.fechaSubida + ' · ' + p.origen }),
      el('span', { clase: 'etiqueta e-' + p.estado, texto: TEXTO[p.estado] || p.estado })
    ]));
    if (p.motivos) caja.appendChild(el('div', { clase: 'aviso warn', texto: p.motivos.split(' | ').join(' · ') }));

    var ia = p.ia || {};
    var filas = [
      ['Monto leído', ia.monto === null || ia.monto === undefined || isNaN(ia.monto) ? '—' : plata(ia.monto)],
      ['Fecha', ia.fecha ? fechaCorta(ia.fecha) : '—'],
      ['Banco o app', ia.banco || '—'],
      ['Destinatario', [ia.destinatario, ia.cuenta].filter(Boolean).join(' · ') || '—'],
      ['¿Coincide?', ia.coincide || '—'],
      ['Remitente', ia.remitente || '—'],
      ['Comprobante', ia.comprobante || '—'],
      ['Observación', ia.observaciones || '—']
    ];
    if (p.origen !== 'manual') {
      var g = el('div', { clase: 'datos-ia' });
      filas.forEach(function (x) { g.appendChild(el('span', { texto: x[0] })); g.appendChild(el('span', { texto: x[1] })); });
      caja.appendChild(g);
    }
    if (p.notaAdmin) caja.appendChild(el('p', { clase: 'sub', texto: 'Tu nota: ' + p.notaAdmin }));

    if (p.tieneArchivo) {
      var zonaImg = el('div', { style: 'margin:8px 0' });
      var btnVer = el('button', { clase: 'chico', onclick: function () {
        btnVer.disabled = true;
        btnVer.textContent = 'Cargando…';
        llamar('apiRecibo', CLAVE, p.id).then(function (r) {
          zonaImg.innerHTML = '';
          if (r.tipo === 'application/pdf') zonaImg.appendChild(el('a', { clase: 'boton chico', target: '_blank', href: r.url }, 'Abrir PDF en Drive'));
          else zonaImg.appendChild(el('img', { clase: 'recibo', src: 'data:' + r.tipo + ';base64,' + r.datos, alt: 'Recibo' }));
        }).catch(function (e) { zonaImg.textContent = mensajeError(e); });
      } }, 'Ver imagen');
      zonaImg.appendChild(btnVer);
      caja.appendChild(zonaImg);
    }

    if (p.estado !== 'rechazado') {
      var monto = el('input', { type: 'number', step: '50000', min: '0', value: String(p.monto || ''), style: 'width:130px', 'aria-label': 'Monto a contar' });
      var nota = el('input', { type: 'text', placeholder: 'Nota (opcional)', style: 'flex:1;min-width:140px', value: p.notaAdmin || '' });
      var estado = el('span', { clase: 'sub' });
      var hacer = function (accion) {
        return function () {
          estado.textContent = 'Guardando…';
          bloquear(caja, true);
          llamar('apiRevisar', CLAVE, p.id, accion, monto.value, nota.value, d.quincena.fecha)
            .then(function (r) { aplicar(r); })
            .catch(function (e) { estado.textContent = mensajeError(e); bloquear(caja, false); });
        };
      };
      var botones = [
        el('span', { clase: 'sub', texto: 'Contar' }), monto, nota,
        el('button', { clase: 'chico primario', onclick: hacer('aprobar') }, 'Aprobar'),
        el('button', { clase: 'chico', onclick: hacer('rechazar') }, 'Rechazar')
      ];
      if (p.tieneArchivo) {
        botones.push(el('button', { clase: 'chico', onclick: function () {
          estado.textContent = 'Leyendo con IA…';
          bloquear(caja, true);
          llamar('apiReprocesar', CLAVE, p.id, d.quincena.fecha).then(function (r) { aplicar(r); })
            .catch(function (e) { estado.textContent = mensajeError(e); bloquear(caja, false); });
        } }, 'Leer de nuevo con IA'));
      }
      botones.push(estado);
      caja.appendChild(el('div', { clase: 'fila-flex' }, botones));
    }
    return caja;
  }

  function formManual(f) {
    var monto = el('input', { type: 'number', step: '50000', min: '0', value: String(Math.max(0, f.esperado - f.pagado) || ''), style: 'width:130px', 'aria-label': 'Monto' });
    var nota = el('input', { type: 'text', placeholder: 'Ej: pagó en efectivo', style: 'flex:1;min-width:160px' });
    var estado = el('span', { clase: 'sub' });
    return el('div', { clase: 'detalle' }, [
      el('p', { clase: 'sub', texto: 'Pago sin recibo en el sistema (efectivo, o recibo que llegó por WhatsApp) para la quincena del ' + fechaCorta(d.quincena.fecha) + '.' }),
      el('div', { clase: 'fila-flex' }, [monto, nota, el('button', { clase: 'chico primario', onclick: function () {
        estado.textContent = 'Guardando…';
        llamar('apiPagoManual', CLAVE, f.id, d.quincena.fecha, monto.value, nota.value)
          .then(function (r) { abiertos[f.id + ':manual'] = false; ultimoJson = ''; aplicar(r); })
          .catch(function (e) { estado.textContent = mensajeError(e); });
      } }, 'Guardar'), estado])
    ]);
  }

  function verEstadisticas() {
    var cont = document.getElementById('estadisticas');
    cont.innerHTML = '';
    cont.appendChild(el('p', { clase: 'sub', texto: 'Calculando…' }));
    llamar('apiEstadisticas', CLAVE).then(function (s) {
      cont.innerHTML = '';
      var qs = s.quincenas.filter(function (q) { return !q.antes; });
      if (qs.length) {
        cont.appendChild(el('p', { clase: 'sub', style: 'margin-top:10px', texto: 'Recaudado por quincena' }));
        qs.forEach(function (q) {
          var pct = q.esperado ? Math.min(100, Math.round(100 * q.recaudado / q.esperado)) : 0;
          cont.appendChild(el('div', { clase: 'fila-flex', style: 'font-size:13px;margin:4px 0' }, [
            el('span', { style: 'width:56px', texto: fechaCorta(q.fecha) }),
            el('div', { clase: 'barra', style: 'flex:1' }, el('div', { style: 'width:' + pct + '%' })),
            el('span', { clase: 'num', style: 'width:150px', texto: plata(q.recaudado) + ' (' + pct + '%)' })
          ]));
        });
      }
      if (!s.personas.length) {
        cont.appendChild(el('p', { clase: 'sub', style: 'margin-top:10px', texto: 'La puntualidad aparece cuando cierre la primera quincena controlada por el sistema.' }));
        return;
      }
      var t = el('table', { style: 'margin-top:12px' }, [el('tr', {}, [
        el('th', { texto: 'Persona' }), el('th', { clase: 'num', texto: 'A tiempo' }), el('th', { clase: 'num', texto: 'Tarde' }),
        el('th', { clase: 'num', texto: 'Vencidas' }), el('th', { clase: 'num', texto: 'Puntualidad' })
      ])]);
      s.personas.sort(function (a, b) { return (b.aTiempo / b.controladas) - (a.aTiempo / a.controladas); }).forEach(function (p) {
        var base = p.controladas - p.receptorSinCuota;
        t.appendChild(el('tr', {}, [
          el('td', { texto: p.nombre }), el('td', { clase: 'num', texto: String(p.aTiempo) }), el('td', { clase: 'num', texto: String(p.tarde) }),
          el('td', { clase: 'num', texto: String(p.vencidas) }),
          el('td', { clase: 'num', texto: base > 0 ? Math.round(100 * p.aTiempo / base) + '%' : '—' })
        ]));
      });
      cont.appendChild(t);
    }).catch(function (e) { cont.textContent = mensajeError(e); });
  }

  function mensajeBienvenida(f) {
    var nombre = f.nombre.split(' ')[0];
    nombre = nombre.charAt(0) + nombre.slice(1).toLowerCase();
    return 'Hola ' + nombre + ', por favor a partir de ahora los soportes de pago de la cadena súbelos por este link ' +
      '(es solo tuyo, no lo compartas):\n' + f.link;
  }

  function verLinks() {
    var cont = document.getElementById('links');
    var boton = document.getElementById('ver-links');
    if (cont.childNodes.length) { cont.innerHTML = ''; boton.textContent = 'Ver'; return; }
    boton.textContent = 'Ocultar';
    cont.appendChild(el('p', { clase: 'sub', style: 'margin-top:8px', texto: 'Envía a cada persona su link una sola vez. El link sirve para toda la cadena.' }));
    d.filas.slice().sort(function (a, b) { return a.nombre.localeCompare(b.nombre); }).forEach(function (f) {
      var copiar = el('button', { clase: 'chico', onclick: function () {
        navigator.clipboard.writeText(f.link).then(function () {
          copiar.textContent = 'Copiado';
          setTimeout(function () { copiar.textContent = 'Copiar link'; }, 1500);
        });
      } }, 'Copiar link');
      cont.appendChild(el('div', { clase: 'persona' }, el('div', { clase: 'cab' }, [
        el('div', { clase: 'nom', texto: f.nombre }),
        f.celular
          ? el('a', { clase: 'boton chico', target: '_blank', href: 'https://wa.me/' + f.celular + '?text=' + encodeURIComponent(mensajeBienvenida(f)) }, 'Enviar por WhatsApp')
          : el('span', { clase: 'sub', texto: 'sin celular' }),
        copiar
      ])));
    });
  }

  function mover(delta) {
    var i = d.quincenas.map(function (x) { return x.fecha; }).indexOf(d.quincena.fecha) + delta;
    if (i >= 0 && i < d.quincenas.length) { abiertos = {}; cargar(d.quincenas[i].fecha); }
  }

  document.getElementById('sel-quincena').addEventListener('change', function (e) { abiertos = {}; cargar(e.target.value); });
  document.getElementById('ant').addEventListener('click', function () { mover(-1); });
  document.getElementById('sig').addEventListener('click', function () { mover(1); });
  document.getElementById('refrescar').addEventListener('click', function () { cargar(d.quincena.fecha, true); });
  document.getElementById('ver-estad').addEventListener('click', verEstadisticas);
  document.getElementById('ver-links').addEventListener('click', verLinks);
  [].forEach.call(document.querySelectorAll('[data-filtro]'), function (b) {
    b.addEventListener('click', function () {
      filtro = b.getAttribute('data-filtro');
      [].forEach.call(document.querySelectorAll('[data-filtro]'), function (x) { x.classList.toggle('activo', x === b); });
      pintarLista();
    });
  });
  cargar();
</script>
</body>
</html>
